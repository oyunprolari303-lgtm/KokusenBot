name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodakı kodları GitHub Actions serverinə yükləyir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java (JDK) mühitini quraşdırır
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle icra faylına (gradlew) işləmə icazəsi verir
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. APK-nı Gradle vasitəsilə derleyir
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Hazırlanmış APK faylını yüklənilə bilən hala gətirir
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
