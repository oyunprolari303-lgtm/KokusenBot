name: Build Mobile APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Proje kodlarını temiz bir şekilde indirir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Bun çalışma ortamını kurar
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Java ortamını hazırlar (Android derleme için zorunlu)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Proje bağımlılıklarını sıfırdan yükler
      - name: Install Project Dependencies
        run: bun install --frozen-lockfile

      # 5. Capacitor mobil araçlarını projeye ekler
      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      # 6. Web arayüzünü (Vite çıktılarını) derler
      - name: Build Web Assets
        run: bun run build

      # 7. Capacitor Android projesini otomatik başlatır ve yapılandırır
      - name: Initialize Capacitor Android
        run: |
          bun x cap init KokusenBot com.kokusen.bot --web-dir=dist
          bun x cap add android
          bun x cap sync android

      # 8. Android klasörünün içine girip hata vermeden doğrudan APK üretir
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache

      # 9. Hazırlanan .apk dosyasını GitHub paneline yükler
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KokusenBot-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
