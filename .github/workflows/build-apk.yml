name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları indirir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java (JDK) ortamını kurar
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Eğer gradlew dosyası yoksa otomatik olarak sıfırdan üretir
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew bulunamadı, sıfırdan oluşturuluyor..."
            gradle wrapper
          fi

      # 4. Gradle resmi aksiyonu ile derlemeyi başlatır ve izinleri otomatik çözer
      - name: Build Debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: assembleDebug

      # 5. APK dosyasını çıktı (artifact) olarak teslim eder
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
